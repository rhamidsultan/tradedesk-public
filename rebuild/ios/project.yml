# XcodeGen project: `brew install xcodegen && xcodegen` creates TradeDesk.xcodeproj (not committed).
name: TradeDesk
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TradeDesk:
    type: application
    platform: iOS
    sources:
      - path: TradeDesk
      - path: Shared
    dependencies:
      - target: TradeDeskWidgets
    info:
      path: TradeDesk/Resources/Info.plist
      properties:
        CFBundleDisplayName: TradeDesk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: "Face ID unlocks your TradeDesk sign-in key on this iPhone."
        NSLocalNetworkUsageDescription: "TradeDesk connects to its server on your Mac over your home Wi-Fi."
        CFBundleURLTypes:
          - CFBundleURLName: tradedesk
            CFBundleURLSchemes: [tradedesk]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TD_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(TD_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        # D8: the same app runs on the Mac (Apple silicon) as "Designed for iPad": choose "My Mac (Designed for
        # iPad)" in Xcode and press Run. Touch ID stands in for Face ID; no Mac-only code to maintain.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  TradeDeskWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: TradeDesk
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TD_BUNDLE_ID).widgets
        DEVELOPMENT_TEAM: $(TD_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  TradeDeskTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TradeDeskTests]
    dependencies:
      - target: TradeDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TD_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(TD_TEAM_ID)
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TradeDesk:
    build:
      targets:
        TradeDesk: all
        TradeDeskTests: [test]
    test:
      targets: [TradeDeskTests]
