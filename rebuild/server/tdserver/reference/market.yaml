# Dated Indian-market calendar for the rebuild server. Never hard-code these in code (CLAUDE.md).
# Copied from py/marketcal refs.yaml on 3 Nov 2026; each year's NSE holiday circular must be added
# before that year starts (the server raises an alert when the list for next year is missing by 1 Dec).
# Times are IST. A row in `sessions` applies from its date until the next row.

timezone: Asia/Kolkata
# Kite access tokens expire at 06:00 IST the next day; a login after 06:00 is for that day.
kite_day_starts: "06:00"

