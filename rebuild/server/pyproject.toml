[project]
name = "tdserver"
version = "0.1.0"
description = "TradeDesk rebuild: server for the iPhone app"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "cryptography>=43",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "pyyaml>=6",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "duckdb>=1.1",   # reads the Parquet market-data store (py/marketdata layout)
  "pyarrow>=16",   # the recorder writes Parquet
  "websockets>=13",  # Zerodha price stream
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tdserver*"]

[tool.setuptools.package-data]
tdserver = ["reference/*.yaml", "console/templates/*.html", "console/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
