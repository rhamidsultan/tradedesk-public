[project]
name = "tradedesk-marketcal"
version = "0.1.0"
description = "Indian market calendar and dated reference data (lot sizes, expiry rules)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk_marketcal"]
