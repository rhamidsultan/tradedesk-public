# Dated Indian-market reference data. Values change: every entry carries a source and `verified`.
# Lot sizes are keyed by contract EXPIRY date (the size applies to contracts expiring on/after `from`).
# Live trading must read lot size and freeze quantity from the broker's instruments dump, not this file.

lot_sizes:
  NIFTY:
    - {from: "2000-01-01", size: 50, verified: true, source: "Algo Lab config (owner)"}
    - {from: "2024-04-26", size: 25, verified: true, source: "Algo Lab config (owner)"}
    - {from: "2025-01-01", size: 75, verified: true, source: "Algo Lab config (owner)"}
    - {from: "2026-01-01", size: 65, verified: true, source: "NSE revision, contracts expiring from Jan 2026"}
  BANKNIFTY:
    - {from: "2000-01-01", size: 15, verified: false, source: "assumption, check NSE circulars before M2"}
    - {from: "2024-12-01", size: 30, verified: false, source: "assumption"}
    - {from: "2025-07-01", size: 35, verified: false, source: "assumption"}
    - {from: "2026-01-01", size: 30, verified: true, source: "NSE revision, contracts expiring from Jan 2026"}
  FINNIFTY:
    - {from: "2026-01-01", size: 60, verified: true, source: "NSE revision, contracts expiring from Jan 2026"}
  MIDCPNIFTY:
    - {from: "2026-01-01", size: 120, verified: true, source: "NSE revision, contracts expiring from Jan 2026"}
  SENSEX:
    - {from: "2000-01-01", size: 10, verified: false, source: "assumption"}
    - {from: "2025-01-01", size: 20, verified: false, source: "assumption: raised during 2025, exact date unverified"}

# Charges for index options at Zerodha (percent values are percent: 0.15 = 0.15%).
# Rows are applied by trade date: a trade before `until` uses the first row it falls under; `current` after.
# Source: owner's Algo Lab config (checked against zerodha.com/charges, Oct 2026). Verify before relying on them.
charges_options:
  history:
    - {until: "2024-10-01", stt_sell_pct: 0.0625, exchange_txn_pct: 0.0495}
    - {until: "2026-04-01", stt_sell_pct: 0.1, exchange_txn_pct: 0.03503}
  current: {brokerage_per_order: 20, stt_sell_pct: 0.15, exchange_txn_pct: 0.03553, sebi_pct: 0.0001,
            stamp_buy_pct: 0.003, gst_pct: 18}

# Rough margin estimate for short index options (SPAN + exposure as % of spot × qty). NOT a broker number:
# M4 replaces it with Kite's basket-margin API. A short strangle gets some offset, hence the lower combined rate.
margin_estimate:
  short_single_pct: 9
  short_strangle_pct: 12
  verified: false

