# Weekly/monthly expiry weekday (0=Mon .. 6=Sun) by date the rule took effect.
# If the expiry weekday is a holiday the contract expires on the previous trading day.
expiry_weekday:
  NIFTY:
    - {from: "2000-01-01", weekday: 3, verified: true, source: "Algo Lab config"}
    - {from: "2025-09-01", weekday: 1, verified: true, source: "Algo Lab config"}
  BANKNIFTY:
    - {from: "2000-01-01", weekday: 2, verified: false, source: "weekly Wednesday until Nov 2024"}
    - {from: "2024-11-21", weekday: 2, verified: false, source: "monthly, last Wednesday"}
    - {from: "2025-01-01", weekday: 3, verified: false, source: "monthly, last Thursday"}
    - {from: "2025-09-01", weekday: 1, verified: false, source: "monthly, last Tuesday"}
  SENSEX:
    - {from: "2000-01-01", weekday: 4, verified: false, source: "weekly Friday"}
    - {from: "2025-01-01", weekday: 1, verified: false, source: "weekly Tuesday"}
    - {from: "2025-09-01", weekday: 3, verified: false, source: "weekly Thursday"}

