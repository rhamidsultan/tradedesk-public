[project]
name = "tradedesk-engine"
version = "0.1.0"
description = "TradeDesk engine: one event loop for backtest, replay, paper and live"
requires-python = ">=3.10"
dependencies = ["tradedesk-strategies", "numpy>=1.24", "duckdb>=1.1", "tradedesk-spec", "tradedesk-marketcal", "tradedesk-marketdata"]

[project.scripts]
td-backtest = "tradedesk_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk_engine"]

[tool.uv.sources]
tradedesk-strategies = { workspace = true }
tradedesk-spec = { workspace = true }
tradedesk-marketcal = { workspace = true }
tradedesk-marketdata = { workspace = true }
