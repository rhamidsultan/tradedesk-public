[project]
name = "tradedesk-strategies"
version = "0.1.0"
description = "Python strategies for TradeDesk (including Algo Lab ports)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk_strategies"]
