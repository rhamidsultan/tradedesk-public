[project]
name = "tradedesk-api"
version = "0.1.0"
description = "TradeDesk API: strategies, backtests, data status; serves the PWA"
requires-python = ">=3.10"
dependencies = ["tradedesk-alerts", "fastapi>=0.110", "uvicorn>=0.29", "webauthn>=2.0", "itsdangerous>=2.1", "pyyaml>=6", "tradedesk-engine", "tradedesk-spec", "tradedesk-marketdata", "tradedesk-marketcal"]

[project.scripts]
td-api = "tradedesk_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk_api"]

[tool.uv.sources]
tradedesk-alerts = { workspace = true }
tradedesk-engine = { workspace = true }
tradedesk-spec = { workspace = true }
tradedesk-marketdata = { workspace = true }
tradedesk-marketcal = { workspace = true }
