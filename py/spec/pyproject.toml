[project]
name = "tradedesk-spec"
version = "0.1.0"
description = "TradeDesk strategy specification v0: models, validation, templates"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk_spec"]
