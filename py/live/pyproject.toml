[project]
name = "tradedesk-live"
version = "0.1.0"
description = "TradeDesk live data recorder and paper-trading runner (read-only Kite; no order code)"
requires-python = ">=3.10"
dependencies = ["tradedesk-oms", "tradedesk-alerts", "numpy>=1.24", "websockets>=12", "pyarrow>=14", "tradedesk-engine", "tradedesk-spec", "tradedesk-marketcal", "tradedesk-marketdata"]

[project.scripts]
td-paper = "tradedesk_live.service:main"
td-ordertest = "tradedesk_live.ordertest:main"
td-weekly-report = "tradedesk_live.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk_live"]

[tool.uv.sources]
tradedesk-oms = { workspace = true }
tradedesk-alerts = { workspace = true }
tradedesk-engine = { workspace = true }
tradedesk-spec = { workspace = true }
tradedesk-marketcal = { workspace = true }
tradedesk-marketdata = { workspace = true }
