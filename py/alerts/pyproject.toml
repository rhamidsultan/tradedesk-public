[project]
name = "tradedesk-alerts"
version = "0.1.0"
description = "TradeDesk alerts: web push, WhatsApp (Meta Cloud API) and email"
requires-python = ">=3.10"
dependencies = ["pywebpush>=2.0", "py-vapid>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradedesk_alerts"]
