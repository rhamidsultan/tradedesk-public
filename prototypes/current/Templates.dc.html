<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeDesk — Strategy templates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dark{--bg:#0E1014;--sf:#161A21;--sf2:#1D222B;--bd:#2A303B;--tx:#E8EAEE;--mu:#A0A8B6;--ac:#5B9BFF;--up:#34C77B;--dn:#FF6B6B;--live:#F5A524;--onac:#0E1014;--onlive:#0E1014;--paper:#8FA3C0;--onpaper:#0E1014;--itm:rgba(91,155,255,0.10);--scrim:rgba(0,0,0,0.6)}
.light{--bg:#F6F7F9;--sf:#FFFFFF;--sf2:#F0F2F5;--bd:#E2E5EA;--tx:#16191F;--mu:#5B6472;--ac:#2A63C7;--up:#0B7A45;--dn:#C42F2F;--live:#9A5B00;--onac:#FFFFFF;--onlive:#FFFFFF;--paper:#4F6B8F;--onpaper:#FFFFFF;--itm:rgba(42,99,199,0.08);--scrim:rgba(16,20,28,0.45)}
.n{font-variant-numeric:tabular-nums}
a{color:var(--ac)}a:hover{color:var(--tx)}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--tx); font-family: Inter, system-ui, sans-serif; font-size: 14px">

<header style="padding: 14px 16px 12px; border-bottom: 1px solid var(--bd); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 20px">New strategy</h1>
<a href="Builder.dc.html" style="font-size: 13px; text-decoration: none; min-height: 44px; display: flex; align-items: center">Start blank</a>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: 500 13px Inter, sans-serif">{{c.label}}</button>
</sc-for>
</div>
</header>

<main style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{shown}}" as="t" hint-placeholder-count="5">
<div style="color: var(--tx); background: var(--sf); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-weight: 600; font-size: 15px">{{t.name}}</span>
<span style="font-size: 12px; color: var(--mu); border: 1px solid var(--bd); border-radius: 4px; padding: 2px 6px; flex: none">{{t.cat}}</span>
</div>
<div style="font-size: 13px; color: var(--mu); line-height: 1.45">{{t.rule}}</div>
<div class="n" style="display: flex; gap: 14px; font-size: 12px; color: var(--mu)">
<span>{{t.style}}</span><span>SL: {{t.sl}}</span><span>{{t.cap}}</span>
</div>
<div style="display: flex; gap: 8px; padding-top: 2px">
<a href="Builder.dc.html" style="flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--bd); color: var(--tx); text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">Customise</a>
<a href="Deploy.dc.html" style="flex: 1.3; height: 44px; border-radius: 10px; background: var(--paper); color: var(--onpaper); text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">Paper trade it</a>
</div>
</div>
</sc-for>
<div style="font-size: 12px; color: var(--mu); text-align: center; padding: 4px 0 8px">Every template needs a stop loss and a daily loss limit before it can be paper traded.</div>
</main>

<nav aria-label="Main" style="display: flex; border-top: 1px solid var(--bd); background: var(--sf); padding-bottom: 18px">
<a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mu); font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="Templates.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--ac); font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Strategies</a>
<a href="OptionChain.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mu); font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Trade</a>
<a href="Positions.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mu); font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"></path></svg>Orders</a>
<a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mu); font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'All' }; }
  renderVals() {
    const all = [
      { name: 'Opening range breakout', cat: 'Breakout', rule: 'Buy ATM CE when NIFTY 5m closes above the 09:15–09:30 high; ATM PE below the low.', style: 'Intraday', sl: 'Spot points', cap: '1 lot from ₹25k' },
      { name: 'Day high / low break', cat: 'Breakout', rule: 'After 13:00, buy ITM option when NIFTY breaks the running day high or low.', style: 'Intraday', sl: 'Spot points', cap: '1 lot from ₹25k' },
      { name: 'Supertrend + VWAP', cat: 'Indicator', rule: 'Long when Supertrend(10,3) turns up and price is above VWAP; exit on flip.', style: 'Intraday', sl: 'Supertrend line', cap: 'Stocks or options' },
      { name: 'EMA 9/21 pullback', cat: 'Indicator', rule: 'In an EMA 9 > 21 trend, enter on a pullback to EMA 9 with RSI above 50.', style: 'Intraday', sl: 'Swing low', cap: 'Stocks or options' },
      { name: 'Premium-matched strangle', cat: 'Option selling', rule: 'Sell OTM CE and PE near ₹40; roll the cheaper leg when one is 2× the other.', style: 'Positional', sl: 'Per leg 3×', cap: '₹1.5–2.5 L' },
      { name: 'Iron fly', cat: 'Option selling', rule: 'Sell ATM straddle, buy wings ±300; defined risk, exit at 1.5% loss or 15:15 expiry.', style: 'Weekly', sl: 'Defined risk', cap: '≈ ₹60k / lot' },
      { name: 'Bull put credit spread', cat: 'Option selling', rule: 'Sell 0.25-delta PE, buy 200 lower, when NIFTY is above its 20-day EMA.', style: 'Weekly', sl: 'Spread 2×', cap: '≈ ₹45k / lot' },
      { name: 'OI build-up follow', cat: 'OI / chain', rule: 'Trade in the direction of the strongest OI build-up near ATM when PCR confirms.', style: 'Intraday', sl: 'Spot points', cap: '1 lot from ₹25k' }
    ];
    const cats = ['All', 'Breakout', 'Indicator', 'Option selling', 'OI / chain'];
    const cur = this.state.cat;
    return {
      theme: this.props.theme ?? 'dark',
      chips: cats.map((c) => ({ label: c, pick: () => this.setState({ cat: c }),
        bg: c === cur ? 'var(--ac)' : 'transparent', fg: c === cur ? 'var(--onac)' : 'var(--tx)', border: c === cur ? 'var(--ac)' : 'var(--bd)' })),
      shown: all.filter((t) => cur === 'All' || t.cat === cur)
    };
  }
}
</script>
</body>
</html>
