<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeDesk — Option chain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dark{--bg:#0E1014;--sf:#161A21;--sf2:#1D222B;--bd:#2A303B;--tx:#E8EAEE;--mu:#A0A8B6;--ac:#5B9BFF;--up:#34C77B;--dn:#FF6B6B;--live:#F5A524;--onac:#0E1014}
.light{--bg:#F6F7F9;--sf:#FFFFFF;--sf2:#F0F2F5;--bd:#E2E5EA;--tx:#16191F;--mu:#5B6472;--ac:#2F6FDB;--up:#0E8A4F;--dn:#D33A3A;--live:#9A5B00;--onac:#FFFFFF}
.n{font-variant-numeric:tabular-nums}
a{color:var(--ac)}a:hover{color:var(--tx)}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--tx); font-family: Inter, system-ui, sans-serif; font-size: 14px">

<header style="padding: 14px 16px 10px; border-bottom: 1px solid var(--bd); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div><h1 style="margin: 0; font-size: 20px">NIFTY</h1><div class="n" style="font-size: 13px; color: var(--mu)">25,842.10 <span style="color: var(--up)">▲ +108.35 (+0.42%)</span></div></div>
<span class="n" style="font-size: 12px; color: var(--mu)">10:46:12</span>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{expiries}}" as="e" hint-placeholder-count="4">
<button onClick="{{e.pick}}" style="flex: none; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid {{e.border}}; background: {{e.bg}}; color: {{e.fg}}; font: 500 12px Inter, sans-serif">{{e.label}}</button>
</sc-for>
</div>
<div class="n" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 11px; color: var(--mu)">
<div>PCR<div style="font-size: 14px; font-weight: 700; color: var(--tx)">1.18</div></div>
<div>Max pain<div style="font-size: 14px; font-weight: 700; color: var(--tx)">25,800</div></div>
<div>ATM IV<div style="font-size: 14px; font-weight: 700; color: var(--tx)">11.6%</div></div>
<div>Straddle<div style="font-size: 14px; font-weight: 700; color: var(--tx)">₹274</div></div>
</div>
</header>

<div class="n" style="display: grid; grid-template-columns: 1fr 58px 70px 58px 1fr; padding: 8px 12px; font-size: 11px; color: var(--mu); border-bottom: 1px solid var(--bd); background: var(--sf)">
<span>CALL OI (L)</span><span style="text-align: right">LTP</span><span style="text-align: center">STRIKE</span><span>LTP</span><span style="text-align: right">PUT OI (L)</span>
</div>

<main style="flex: 1; overflow-y: auto">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
<div class="n" style="display: grid; grid-template-columns: 1fr 58px 70px 58px 1fr; align-items: center; min-height: 44px; padding: 0 12px; border-bottom: 1px solid var(--bd); background: {{r.rowBg}}; font-size: 13px">
<div style="display: flex; flex-direction: column; gap: 3px"><span>{{r.ceOi}} <span style="font-size: 11px; color: {{r.ceChgC}}">{{r.ceChg}}</span></span><div style="height: 4px; width: {{r.ceW}}; background: var(--dn); opacity: 0.75; border-radius: 2px"></div></div>
<span style="text-align: right; background: {{r.ceItm}}; padding: 4px 0">{{r.ce}}</span>
<span style="text-align: center; font-weight: {{r.kW}}">{{r.k}}</span>
<span style="background: {{r.peItm}}; padding: 4px 0">{{r.pe}}</span>
<div style="display: flex; flex-direction: column; gap: 3px; align-items: flex-end"><span><span style="font-size: 11px; color: {{r.peChgC}}">{{r.peChg}}</span> {{r.peOi}}</span><div style="height: 4px; width: {{r.peW}}; background: var(--up); opacity: 0.75; border-radius: 2px"></div></div>
</div>
</sc-for>
</main>

<footer style="border-top: 1px solid var(--bd); background: var(--sf); padding: 10px 16px; display: flex; gap: 10px">
<a href="Templates.dc.html" style="flex: 1; height: 46px; border-radius: 12px; border: 1px solid var(--bd); color: var(--tx); text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">OI build-up</a>
<a href="Builder.dc.html" style="flex: 1.4; height: 46px; border-radius: 12px; background: var(--ac); color: var(--onac); text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">Build from chain</a>
</footer>

<nav aria-label="Main" style="display: flex; border-top: 1px solid var(--bd); background: var(--sf); padding-bottom: 18px">
<a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mu); font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="Templates.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mu); font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>Strategies</a>
<a href="OptionChain.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--ac); font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Trade</a>
<a href="Positions.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mu); font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"></path></svg>Orders</a>
<a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--mu); font-size: 11px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { exp: 0 }; }
  renderVals() {
    const S = 25842.1;
    const ks = [25600, 25650, 25700, 25750, 25800, 25850, 25900, 25950, 26000, 26050, 26100];
    const ceOi = [18.2, 9.4, 21.6, 24.1, 52.3, 61.8, 74.5, 69.2, 128.6, 88.1, 102.4];
    const peOi = [96.4, 71.2, 104.8, 88.6, 142.1, 79.3, 41.7, 22.5, 18.9, 8.2, 6.4];
    const ceCh = [-2.1, 0.4, -1.8, 3.2, 8.7, 14.1, 19.6, 11.3, 31.2, 9.8, 12.5];
    const peCh = [12.4, 6.1, 18.2, 11.7, 34.6, 21.3, 7.2, 2.1, -0.8, -1.2, 0.3];
    const max = 142.1;
    const tv = (k) => 138 * Math.exp(-Math.abs(k - S) / 210);
    const atm = 25850;
    const f = (v) => v.toFixed(2);
    const exps = ['27 Oct · 5d', '3 Nov · 12d', '10 Nov · 19d', '24 Nov · M'];
    return {
      theme: this.props.theme ?? 'dark',
      expiries: exps.map((e, i) => ({ label: e, pick: () => this.setState({ exp: i }),
        bg: this.state.exp === i ? 'var(--ac)' : 'transparent', fg: this.state.exp === i ? 'var(--onac)' : 'var(--tx)', border: this.state.exp === i ? 'var(--ac)' : 'var(--bd)' })),
      rows: ks.map((k, i) => ({
        k: k.toLocaleString('en-IN'), kW: k === atm ? 700 : 500,
        rowBg: k === atm ? 'var(--sf2)' : 'transparent',
        ce: f(Math.max(0, S - k) + tv(k)), pe: f(Math.max(0, k - S) + tv(k)),
        ceItm: k < S ? 'var(--sf)' : 'transparent', peItm: k > S ? 'var(--sf)' : 'transparent',
        ceOi: ceOi[i].toFixed(1), peOi: peOi[i].toFixed(1),
        ceW: Math.round(ceOi[i] / max * 100) + '%', peW: Math.round(peOi[i] / max * 100) + '%',
        ceChg: (ceCh[i] > 0 ? '+' : '') + ceCh[i], peChg: (peCh[i] > 0 ? '+' : '') + peCh[i],
        ceChgC: ceCh[i] >= 0 ? 'var(--mu)' : 'var(--dn)', peChgC: peCh[i] >= 0 ? 'var(--mu)' : 'var(--dn)'
      }))
    };
  }
}
</script>
</body>
</html>
